name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: ai_infra
          POSTGRES_PASSWORD: ai_infra
          POSTGRES_DB: ai_infra_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ai_infra -d ai_infra_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ai_infra:ai_infra@127.0.0.1:5432/ai_infra_test
      E2E_DATABASE_URL: postgresql://ai_infra:ai_infra@127.0.0.1:5432/ai_infra_test
      E2E_REDIS_URL: redis://127.0.0.1:6379/1
      REDIS_URL: redis://127.0.0.1:6379/1
      E2E_TEST: "1"
      SEC_USER_AGENT: AI Infra Terminal CI ci@example.com
      ARTIFACT_STORAGE_ENDPOINT: http://127.0.0.1:9000
      ARTIFACT_STORAGE_BUCKET: ai-infra-source-artifacts
      ARTIFACT_STORAGE_REGION: us-east-1
      ARTIFACT_STORAGE_ACCESS_KEY: ai_infra
      ARTIFACT_STORAGE_SECRET_KEY: ai_infra_artifacts
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.7.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Start immutable source object store
        run: |
          docker run --detach --name ai-infra-minio --publish 9000:9000 \
            --env MINIO_ROOT_USER="$ARTIFACT_STORAGE_ACCESS_KEY" \
            --env MINIO_ROOT_PASSWORD="$ARTIFACT_STORAGE_SECRET_KEY" \
            minio/minio:RELEASE.2025-09-07T16-13-09Z server /data
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:9000/minio/health/live && exit 0
            sleep 1
          done
          docker logs ai-infra-minio
          exit 1
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Run isolated real source pipeline
        env:
          PGPASSWORD: ai_infra
          DATABASE_URL: postgresql://ai_infra:ai_infra@127.0.0.1:5432/ai_infra_pipeline_test
          E2E_DATABASE_URL: postgresql://ai_infra:ai_infra@127.0.0.1:5432/ai_infra_pipeline_test
        run: |
          createdb --host 127.0.0.1 --username ai_infra ai_infra_pipeline_test
          pnpm db:migrate
          pnpm test:integration:pipeline
      - name: Run deterministic research quality gate
        run: |
          pnpm db:migrate
          pnpm db:seed:e2e
          pnpm research:quality -- --gate
          pnpm research:metric-quality -- --gate
          pnpm research:extraction-quality -- --gate
      - run: pnpm test:e2e
      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-diagnostics
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
